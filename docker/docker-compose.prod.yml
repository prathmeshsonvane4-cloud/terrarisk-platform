# Production stack: PostGIS + backend (FastAPI/uvicorn) + frontend
# (Next.js standalone) + nginx reverse proxy, on one internal network.
#
# Run from the repo root:
#   docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --build
#
# See docs/Deployment_Guide.md for the full walkthrough (SSL, backups,
# updating, rollback). docker/docker-compose.yml (single PostGIS service)
# remains the *local development* compose file — unrelated to this one.

name: terrarisk-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host by default — only `backend` (on the
    # internal network) needs to reach it. Uncomment to allow a host-side
    # admin client to connect directly:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - terrarisk_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-TerraRisk Credit Intelligence API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}
      # Derived from the same POSTGRES_* vars the postgres service uses —
      # one source of truth, no separately-typed connection string to keep
      # in sync by hand. Host is the postgres *service* name, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-720}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      # Fixed in-container path — the host key file is bind-mounted here
      # (see the volumes block below), regardless of where it lives on the
      # host. GEE_SERVICE_ACCOUNT_JSON_HOST_PATH (root .env) controls the
      # host side of that mount.
      GEE_SERVICE_ACCOUNT_JSON_PATH: /run/secrets/gee-service-account.json
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      REPORT_PDF_CACHE_DIR: var/pdf_cache
    volumes:
      - pdf_cache:/app/var/pdf_cache
      - uploads:/app/app/uploads
      - ${GEE_SERVICE_ACCOUNT_JSON_HOST_PATH}:/run/secrets/gee-service-account.json:ro
    networks:
      - terrarisk_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Empty (relative) by default: nginx proxies /api/ to the backend
        # on the same public origin, so the browser never needs an
        # absolute API URL in the primary deployment path. Override only
        # if the frontend is deployed without nginx in front of it.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - terrarisk_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount a real certificate directory here once TLS is enabled (see
      # docs/Deployment_Guide.md) — empty/absent is fine while the HTTPS
      # server block in nginx.conf stays commented out.
      - ${NGINX_CERTS_HOST_PATH:-./nginx/certs}:/etc/nginx/certs:ro
    networks:
      - terrarisk_net

networks:
  terrarisk_net:
    driver: bridge

volumes:
  postgres_data:
  pdf_cache:
  uploads:
