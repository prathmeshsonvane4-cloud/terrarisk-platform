# Certificate for the server's bare IP, 174.138.122.238 (a DigitalOcean
# Reserved IP, so it does not change). Let's Encrypt issues IP certificates
# only on its six-day "shortlived" profile; certbot (4.0+) renews one once
# half its lifetime has passed, the certbot service checks every 12h, and
# nginx reloads every 6h — about six renewal attempts before any expiry.
# Interim until kshetra.in exists: see nginx.https-ip.conf.
ssl_certificate     /etc/letsencrypt/live/174.138.122.238/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/174.138.122.238/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
