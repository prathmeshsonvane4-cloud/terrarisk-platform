# Baseline security headers.
#
# nginx inherits add_header from an outer level ONLY if the inner level
# sets none of its own. nginx.conf includes this at http{} level, as
# before. nginx.https.conf must include it inside the TLS server{} itself,
# because that server also adds Strict-Transport-Security — which would
# otherwise silently drop every header below. (/_next/static/ sets its own
# Cache-Control and so drops these in both modes; that predates TLS.)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy is left deliberately disabled: the map
# (MapLibre + Terra Draw, see docs/DECISIONS.md) loads raster tiles from
# Esri World Imagery and the tile URL is deliberately env-swappable
# (NEXT_PUBLIC_MAP_TILE_URL). Shipping a CSP without a verified, current
# inventory of every external origin the frontend contacts would risk
# silently breaking the map — a hardening step to tune and enable
# deliberately, not a default (docs/Deployment_Guide.md).
