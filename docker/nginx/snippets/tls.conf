# Certificate for kshetra.in and www.kshetra.in, issued by the certbot
# service with --cert-name kshetra.in (docs/Deployment_Guide.md §4) and
# renewed by it in place; nginx reloads every 6h to pick renewals up.
ssl_certificate     /etc/letsencrypt/live/kshetra.in/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/kshetra.in/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
