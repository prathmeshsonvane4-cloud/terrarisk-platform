# Shared http{} settings, included by both nginx.conf (plain HTTP) and
# nginx.https.conf (TLS for kshetra.in). One copy, so the two modes cannot
# drift apart: the old commented-out HTTPS block had silently kept
# api_limit's pre-fix `burst=200 nodelay` after the live block moved on.

sendfile      on;
keepalive_timeout 65;

# Payload cap for request bodies — headroom for a hand-drawn polygon's
# GeoJSON ring (capped server-side at 2000 vertices, see
# docs/DECISIONS.md's RC1 audit entry) while still bounding abuse.
# Revisit once Service 2's CSV portfolio upload exists.
client_max_body_size 10m;

# RC2 security finding: nothing anywhere (app or proxy layer) throttled
# login attempts — bcrypt's cost factor slows one attempt but does
# nothing against distributed/parallel guessing against a small, fixed
# set of named bank-officer accounts (see backend/scripts/create_admin_user.py).
# Per-IP, not per-account: an account-keyed limiter would itself be a
# denial-of-service vector (lock a real officer out by hammering their
# known email). login_limit is deliberately tight (a real officer logs
# in once per session, not repeatedly); api_limit is a much looser
# general backstop against one client hammering the API.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# api_limit was 60r/m (one request per second). That is far below what
# a single legitimate page load costs: the Water Intelligence map
# fetches geometry and report history per catchment, so opening it for
# one taluka (139 catchments) issues ~278 reads at once. With the old
# limit nginx 429ed most of them and the map silently rendered only
# the ~35 villages whose requests got through — confirmed in the
# access log: 534 rate-limited requests in 15 minutes, 321 to
# /catchments and 208 to /admin-boundaries.
#
# 600r/m with a burst of 200 absorbs a full map load while still
# stopping sustained scraping. It does NOT make the underlying N+1
# acceptable — that is a real defect and the proper fix (one batched
# read instead of two-per-catchment) is tracked separately. This
# raises a ceiling that was set for a much smaller deployment and had
# become the binding constraint on correct behaviour; it does not
# excuse the request pattern.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}
