# The application's routes — identical in HTTP and HTTPS mode, included by
# the serving server{} of each.

# RC2 documentation-accuracy finding: neither /health nor
# /health/ready (app/main.py, unprefixed by design — an
# orchestrator/LB probe shouldn't need to know the API version)
# was reachable through the public origin at all — only /api/ and
# / were proxied, so an external uptime monitor or load balancer
# pointed at the public domain had nothing to hit. Both are
# unauthenticated by design (see /health/ready's own docstring),
# so exposing them here is intentional, not a gap.
location = /health {
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
}

location = /health/ready {
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
}

# Tighter limit on login specifically — matched before the general
# /api/ prefix location since nginx always prefers a more specific
# match regardless of file order, but placed first here for
# readability too.
location = /api/v1/auth/login {
    limit_req zone=login_limit burst=3 nodelay;
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Backend API — no path rewrite. The backend already serves every
# route under /api/v1 (app/main.py's API_V1_PREFIX), so the
# request URI passes through unchanged and the frontend's
# NEXT_PUBLIC_API_BASE_URL can stay a relative "" in production
# (same-origin, no CORS involved for browser traffic).
location /api/ {
    # burst=500 delay=200, NOT nodelay. `nodelay` serves the burst
    # immediately but REJECTS anything beyond it, so a map load of
    # ~278 concurrent reads still 429ed roughly 78 of them even
    # after the rate itself was raised — a partially drawn map,
    # which is the failure this whole change exists to stop.
    #
    # With delay=200 the first 200 are served instantly (a normal
    # page stays snappy) and the next 300 are QUEUED at the zone
    # rate rather than failed, so a heavy but legitimate load
    # completes slowly instead of silently losing villages.
    # Rejection only resumes past 500, which no single page reaches.
    limit_req zone=api_limit burst=500 delay=200;
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Next.js content-hashed static assets — safe to cache aggressively
# and immutably; a new build always ships a new hashed filename.
location /_next/static/ {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
