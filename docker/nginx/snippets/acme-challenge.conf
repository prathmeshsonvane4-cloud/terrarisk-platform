# Let's Encrypt HTTP-01 challenges, answered from the webroot the certbot
# service writes into (docker-compose.prod.yml, volume certbot_www).
# Served on port 80 in both modes: before TLS so the first certificate can
# be issued without taking the site down, and after TLS so renewals work
# (the redirect to HTTPS must not swallow these requests — ^~ wins).
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
}
