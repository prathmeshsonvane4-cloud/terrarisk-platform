# TLS on the bare IP — https://174.138.122.238 — for use until kshetra.in
# is registered. Selected with NGINX_CONF_FILE=nginx.https-ip.conf, and only
# after the IP certificate exists (docs/Deployment_Guide.md §4): nginx
# refuses to start if snippets/tls-ip.conf points at missing files.
# Once the domain works, switch to nginx.https.conf and retire this file.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    include snippets/http-common.conf;

    # Port 80: certificate renewals, and a redirect for everything else.
    server {
        listen 80 default_server;
        server_name _;

        include snippets/acme-challenge.conf;

        location / {
            return 301 https://174.138.122.238$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        include snippets/tls-ip.conf;
        include snippets/security-headers.conf;

        # No Strict-Transport-Security: browsers ignore HSTS for IP
        # addresses (RFC 6797 §8.1), so it would only look like protection.

        include snippets/app-locations.conf;
    }
}
