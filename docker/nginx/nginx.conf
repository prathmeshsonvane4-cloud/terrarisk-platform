# Plain-HTTP mode — the default, and what a fresh clone runs: no
# certificate is needed to boot. Also the mode in which the first TLS
# certificate is issued, since it already answers ACME challenges.
#
# TLS for kshetra.in lives in nginx.https.conf, selected with
# NGINX_CONF_FILE=nginx.https.conf in the root .env
# (docs/Deployment_Guide.md §4). Everything both modes share is in
# snippets/, so a change there applies to both.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    include snippets/http-common.conf;

    # At http{} level, so every response carries them — see the file for
    # why nginx.https.conf includes it per server instead.
    include snippets/security-headers.conf;

    server {
        listen 80;
        server_name _;

        include snippets/acme-challenge.conf;
        include snippets/app-locations.conf;
    }
}
