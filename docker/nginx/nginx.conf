worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Payload cap for request bodies — headroom for a hand-drawn polygon's
    # GeoJSON ring (capped server-side at 2000 vertices, see
    # docs/DECISIONS.md's RC1 audit entry) while still bounding abuse.
    # Revisit once Service 2's CSV portfolio upload exists.
    client_max_body_size 10m;

    # RC2 security finding: nothing anywhere (app or proxy layer) throttled
    # login attempts — bcrypt's cost factor slows one attempt but does
    # nothing against distributed/parallel guessing against a small, fixed
    # set of named bank-officer accounts (see backend/scripts/create_admin_user.py).
    # Per-IP, not per-account: an account-keyed limiter would itself be a
    # denial-of-service vector (lock a real officer out by hammering their
    # known email). login_limit is deliberately tight (a real officer logs
    # in once per session, not repeatedly); api_limit is a much looser
    # general backstop against one client hammering the API.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Baseline security headers. Applied globally (not just to the app
    # location) so they're present on every response, including proxied
    # static assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Left deliberately disabled by default:
    #
    # - Strict-Transport-Security: only meaningful (and safe) once the
    #   HTTPS server block below is actually enabled with a real
    #   certificate — sending it over plain HTTP does nothing but risks
    #   locking out a misconfigured first deploy. Uncomment once TLS is live
    #   (docs/Deployment_Guide.md).
    # - Content-Security-Policy: the map (MapLibre + Terra Draw, see
    #   docs/DECISIONS.md) loads raster tiles from Esri World Imagery and
    #   the tile URL is deliberately env-swappable
    #   (NEXT_PUBLIC_MAP_TILE_URL). Shipping a CSP here without a verified,
    #   current inventory of every external origin the frontend contacts
    #   would risk silently breaking the map on first boot — a hardening
    #   step for the operator to tune and enable deliberately, not a
    #   default (docs/Deployment_Guide.md).
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # add_header Content-Security-Policy "..." always;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # RC2 documentation-accuracy finding: neither /health nor
        # /health/ready (app/main.py, unprefixed by design — an
        # orchestrator/LB probe shouldn't need to know the API version)
        # was reachable through the public origin at all — only /api/ and
        # / were proxied, so an external uptime monitor or load balancer
        # pointed at the public domain had nothing to hit. Both are
        # unauthenticated by design (see /health/ready's own docstring),
        # so exposing them here is intentional, not a gap.
        location = /health {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        location = /health/ready {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # Tighter limit on login specifically — matched before the general
        # /api/ prefix location since nginx always prefers a more specific
        # match regardless of file order, but placed first here for
        # readability too.
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API — no path rewrite. The backend already serves every
        # route under /api/v1 (app/main.py's API_V1_PREFIX), so the
        # request URI passes through unchanged and the frontend's
        # NEXT_PUBLIC_API_BASE_URL can stay a relative "" in production
        # (same-origin, no CORS involved for browser traffic).
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js content-hashed static assets — safe to cache aggressively
        # and immutably; a new build always ships a new hashed filename.
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS — disabled until a certificate exists (see
    # docs/Deployment_Guide.md's SSL section for obtaining one via certbot
    # and enabling this block). A fresh clone must be able to run
    # `docker compose up` over plain HTTP with no cert on disk.
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.example;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #
    #     location = /health {
    #         proxy_pass http://backend_upstream;
    #         proxy_set_header Host $host;
    #     }
    #
    #     location = /health/ready {
    #         proxy_pass http://backend_upstream;
    #         proxy_set_header Host $host;
    #     }
    #
    #     location = /api/v1/auth/login {
    #         limit_req zone=login_limit burst=3 nodelay;
    #         proxy_pass http://backend_upstream;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /api/ {
    #         limit_req zone=api_limit burst=20 nodelay;
    #         proxy_pass http://backend_upstream;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /_next/static/ {
    #         proxy_pass http://frontend_upstream;
    #         proxy_set_header Host $host;
    #         add_header Cache-Control "public, max-age=31536000, immutable" always;
    #     }
    #
    #     location / {
    #         proxy_pass http://frontend_upstream;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
