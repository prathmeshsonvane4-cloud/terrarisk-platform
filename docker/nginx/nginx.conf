worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Payload cap for request bodies — headroom for a hand-drawn polygon's
    # GeoJSON ring (capped server-side at 2000 vertices, see
    # docs/DECISIONS.md's RC1 audit entry) while still bounding abuse.
    # Revisit once Service 2's CSV portfolio upload exists.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Baseline security headers. Applied globally (not just to the app
    # location) so they're present on every response, including proxied
    # static assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Left deliberately disabled by default:
    #
    # - Strict-Transport-Security: only meaningful (and safe) once the
    #   HTTPS server block below is actually enabled with a real
    #   certificate — sending it over plain HTTP does nothing but risks
    #   locking out a misconfigured first deploy. Uncomment once TLS is live
    #   (docs/Deployment_Guide.md).
    # - Content-Security-Policy: the map (MapLibre + Terra Draw, see
    #   docs/DECISIONS.md) loads raster tiles from Esri World Imagery and
    #   the tile URL is deliberately env-swappable
    #   (NEXT_PUBLIC_MAP_TILE_URL). Shipping a CSP here without a verified,
    #   current inventory of every external origin the frontend contacts
    #   would risk silently breaking the map on first boot — a hardening
    #   step for the operator to tune and enable deliberately, not a
    #   default (docs/Deployment_Guide.md).
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # add_header Content-Security-Policy "..." always;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Backend API — no path rewrite. The backend already serves every
        # route under /api/v1 (app/main.py's API_V1_PREFIX), so the
        # request URI passes through unchanged and the frontend's
        # NEXT_PUBLIC_API_BASE_URL can stay a relative "" in production
        # (same-origin, no CORS involved for browser traffic).
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js content-hashed static assets — safe to cache aggressively
        # and immutably; a new build always ships a new hashed filename.
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS — disabled until a certificate exists (see
    # docs/Deployment_Guide.md's SSL section for obtaining one via certbot
    # and enabling this block). A fresh clone must be able to run
    # `docker compose up` over plain HTTP with no cert on disk.
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.example;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #
    #     location /api/ {
    #         proxy_pass http://backend_upstream;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /_next/static/ {
    #         proxy_pass http://frontend_upstream;
    #         proxy_set_header Host $host;
    #         add_header Cache-Control "public, max-age=31536000, immutable" always;
    #     }
    #
    #     location / {
    #         proxy_pass http://frontend_upstream;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
