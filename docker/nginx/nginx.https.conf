# TLS mode for https://kshetra.in — selected with
# NGINX_CONF_FILE=nginx.https.conf in the root .env, and only after the
# certificate exists (docs/Deployment_Guide.md §4): nginx refuses to
# start if snippets/tls.conf points at files that are not there.
#
# Canonical origin is https://kshetra.in. Plain HTTP, www, and the bare
# IP all redirect there, so there is one origin for the browser, the
# backend's FRONTEND_ORIGIN and every link a founder is sent.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    include snippets/http-common.conf;

    # Port 80: certificate renewals, and a redirect for everything else.
    server {
        listen 80 default_server;
        server_name _;

        include snippets/acme-challenge.conf;

        location / {
            return 301 https://kshetra.in$request_uri;
        }
    }

    # 443 for anything that is not the canonical host (www, the bare IP):
    # redirect. A browser reaching the bare IP over HTTPS still sees a
    # name-mismatch warning first — a certificate cannot name an IP here.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        include snippets/tls.conf;

        return 301 https://kshetra.in$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name kshetra.in;

        include snippets/tls.conf;

        # Must be here, not at http{} level: this server's own add_header
        # (HSTS) would otherwise stop the security headers from inheriting.
        include snippets/security-headers.conf;

        # One day to start. A misissued certificate plus a long HSTS
        # max-age locks visitors out until it expires; raise this to
        # 63072000 (two years) once HTTPS has run cleanly for a week.
        # No includeSubDomains until every future subdomain is HTTPS too.
        add_header Strict-Transport-Security "max-age=86400" always;

        include snippets/app-locations.conf;
    }
}
